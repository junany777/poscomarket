name: Refresh OpenDART snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python scripts/fetch_dart_snapshot.py
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dart/*.json
          git diff --cached --quiet || git commit -m "chore: refresh OpenDART snapshot"
          git push
